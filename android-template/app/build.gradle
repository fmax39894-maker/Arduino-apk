plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.voicearduino'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.voicearduino'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
